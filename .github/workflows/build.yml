name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # Tests, builds the PC app and publishes it to GitHub Pages (the app's code only — no case data).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (deadline math, order reader, workflows)
        run: npx vitest run
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    # Builds the phone app and attaches it to a GitHub release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and copy it into Android
        run: npm run build && npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/casemanager.p12"
            echo "CM_KEYSTORE_FILE=$RUNNER_TEMP/casemanager.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE secret not set; building with a throwaway key."
          fi
      - name: Build APK
        working-directory: android
        env:
          CM_KEYSTORE_PASSWORD: casemanager-signing
          CM_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$CM_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/CaseManager.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CaseManager.apk"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/CaseManager.apk" \
            --title "Case Manager $TAG" \
            --notes "Phone app build from $(git log -1 --pretty=%s). Install: open this page on your phone and tap CaseManager.apk." \
            --latest
